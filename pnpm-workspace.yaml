packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true

# better-auth 1.4.21 согласован с better-call 1.1.8; более новый 1.3.x ломает twoFactor
# (строгая проверка «GET с body»). Фиксируем, чтобы install/CI не подтянул несовместимый.
overrides:
  better-call: 1.1.8
