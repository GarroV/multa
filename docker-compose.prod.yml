# Multa — прод-стек для MUSPELHEIM (Docker). Доступ извне — через `tailscale serve` на web:80.
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    labels:
      backup.pgdump: 'true' # для бэкап-задачи MUSPELHEIM
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    # Домашний сервер: логи не должны съесть диск между визитами.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    # PID 1 отдаём init: он хоронит зомби и корректно раздаёт сигналы при docker stop.
    init: true
    # Тот же healthcheck, что в образе, но с явными таймингами стека: миграции при старте
    # занимают время, и до их конца контейнер не должен считаться живым.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        # Caddy поднимется и без api, но тогда первый заход отдаёт 502 — ждём готовности.
        condition: service_healthy
    ports:
      - '80:80'
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
