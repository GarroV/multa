name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: смысла проверять устаревший коммит нет,
# а минуты он жжёт. Группа по workflow+ref, чтобы main и PR-ветки не мешали друг другу.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # ЖЁСТКИЙ потолок. Без него 19.08.2026 три прогона зависли и висели по 6 часов (дефолтный
    # лимит GitHub) — 1080 минут, больше половины месячной квоты аккаунта, из-за чего Actions
    # встали во всех приватных репозиториях. Нормальный прогон здесь — 8 минут, 15 с запасом:
    # если job не уложился, он сломан, а не медленный. См. issue #148.
    timeout-minutes: 15

    # Интеграционные тесты api ходят в настоящий Postgres: они проверяют миграции, каскад и
    # изоляцию workspace, а на моках эти гарантии проверить нечем.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: multa
          POSTGRES_PASSWORD: multa_dev_password
          POSTGRES_DB: multa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multa -d multa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://multa:multa_dev_password@localhost:5432/multa_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Формат — до типов: он дешевле и ловит расхождение стиля, пока диффы ещё читаемы.
      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Прод-сборки: web без VITE_API_URL (как за Caddy) и бандл api, который уезжает в образ.
      - name: Build (prod)
        run: pnpm build

      # Смоук собранного бандла: логин однажды умер падением на уровне модуля, которое
      # тесты по исходникам не видят (у них своя сборка и свой env).
      - name: Smoke prod bundle
        run: pnpm --filter @multa/web test:bundle

      # E2E гоняет прод-сборку в настоящем браузере на отдельной базе: юниты не видят ни
      # переполнения раскладки, ни гейта, который показывал форму логина вместо демо.
      - name: Create e2e database
        run: PGPASSWORD=multa_dev_password psql -h localhost -U multa -d multa_test -c 'CREATE DATABASE multa_e2e OWNER multa'

      - name: Install browser
        # Три браузера, как требуют правила: Safari и Firefox гоняют критические пути.
        # Ставить их надо явно — иначе прогон падает не тестом, а отсутствием бинаря.
        run: pnpm --filter @multa/web exec playwright install --with-deps chromium webkit firefox

      - name: E2E (browser)
        run: pnpm --filter @multa/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
